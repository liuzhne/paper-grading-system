name: pgs-production-gates

on:
  push:
    branches: [main, Convert2RubricScalePlatform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCORING_ENGINE_MODE: legacy
  PYTHONUNBUFFERED: "1"

jobs:
  unit-and-sqlite-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Run the complete self-contained suite
        run: |
          mkdir -p pgs_ops_artifacts
          uv run python -m pytest -q --junitxml=pgs_ops_artifacts/pytest.xml
      - name: Upload unit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgs-unit-and-sqlite-evidence
          path: pgs_ops_artifacts/
          if-no-files-found: error
          retention-days: 30

  frontend-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/workbench/package-lock.json
      - name: Install the locked frontend environment
        working-directory: frontend/workbench
        run: npm ci
      - name: Run component and state tests
        working-directory: frontend/workbench
        run: npm run test:unit
      - name: Install uv and Python for the contract and assembly steps
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      # 浏览器验收的 webServer 是真实 FastAPI，OpenAPI 快照也要从真实应用导出；
      # 只装 uv 而不 sync，两者都只会报成超时或 ModuleNotFoundError。
      - name: Install the locked backend environment
        run: uv sync --locked
      - name: Check types
        working-directory: frontend/workbench
        run: npm run typecheck
      # 前端是纯 JS，调错路径没有编译期报错，只在浏览器里变成一个 404。这一步
      # 从真实应用导出 OpenAPI，重新生成类型，与已提交的 schema.d.ts 比对：
      # 后端合同变了而前端没跟上，会直接显示成 diff。
      - name: Check the API contract snapshot
        working-directory: frontend/workbench
        run: npm run api:dump && npm run api:check
      # Vercel's build hook runs scripts/build_web_static.py without
      # --with-workbench, so the deployed workbench is whatever public/workbench
      # holds in the repository. Rebuild it here and fail on any drift: without
      # this gate a source change could ship behind a stale committed bundle.
      - name: Assemble the static artifact from source
        run: python scripts/build_web_static.py --with-workbench
      - name: Fail if the committed public/ artifact drifted from source
        shell: bash
        run: |
          set -euo pipefail
          # --porcelain also reports untracked files; `git diff` alone would
          # miss a rebuild that only adds newly-hashed asset names.
          drift="$(git status --porcelain -- public/)"
          if [[ -n "$drift" ]]
          then
            echo "::error::public/ is out of sync with frontend sources."
            echo "Run: python scripts/build_web_static.py --with-workbench"
            echo "then commit the regenerated public/ artifact."
            echo "$drift"
            exit 1
          fi
      - name: Install the Playwright browser
        working-directory: frontend/workbench
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance (V03-V07, V09, V11, V12)
        working-directory: frontend/workbench
        env:
          # webServer 起的是真实 FastAPI + 统一组装产物，不是 Vite dev server：
          # 深链接回退、缺失资源 404、/api 不被吞掉这几条只在生产托管路径上
          # 才会出问题。路径相对 webServer 的 cwd（仓库根）。
          PGS_PYTHON: .venv/bin/python
        run: npx playwright test
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgs-frontend-workbench-evidence
          path: |
            public/workbench/index.html
            frontend/workbench/package-lock.json
            frontend/workbench/playwright-report/
            frontend/workbench/test-results/
          if-no-files-found: error
          retention-days: 30

  postgres-migrations-constraints-and-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paper_grading
          POSTGRES_USER: paper
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paper -d paper_grading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://paper:ci-only-postgres-password@127.0.0.1:5432/paper_grading
      PGPASSWORD: ci-only-postgres-password
      OPS_RTO_MINUTES: "120"
      OPS_RPO_MINUTES: "1440"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install PostgreSQL client and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          uv sync --locked
      - name: Exercise every production migration boundary
        run: |
          set -euo pipefail
          mkdir -p pgs_ops_artifacts
          for revision in \
            0011_version_hash_on_update \
            0012_frozen_scoring_policy \
            0013_core_replay_identity \
            0014_release_gate_profiles \
            0015_scoring_run_runtime_identity \
            0016_general_submissions \
            0017_batch_scoring_jobs \
            0018_identity_organizations \
            0019_resource_organization_scope \
            0020_rubric_visibility_scope \
            0021_private_ai_connections \
            0022_legacy_tenant_backfill \
            0023_rule_scoring_review_tasks \
            0024_batch_status_machine \
            0025_review_contract \
            0026_review_command_receipts \
            0027_export_events \
            0028_export_event_backfill
          do
            uv run alembic upgrade "$revision" 2>&1 | tee -a pgs_ops_artifacts/postgres-migrations.log
          done
      - name: Verify Postgres constraints and stable ordering
        run: |
          uv run python -m backend.app.scripts.verify_postgres_ops --exercise-ci-fixture \
            | tee pgs_ops_artifacts/postgres-verification.json
      - name: Prove lossy 0017 downgrade is rejected without DDL damage
        run: |
          set -euo pipefail
          if uv run alembic downgrade 0016_general_submissions >> pgs_ops_artifacts/postgres-migrations.log 2>&1
          then
            echo "ERROR: lossy downgrade unexpectedly succeeded" | tee -a pgs_ops_artifacts/postgres-migrations.log
            exit 1
          fi
          echo "expected lossy downgrade refusal observed" | tee -a pgs_ops_artifacts/postgres-migrations.log
          uv run python -m backend.app.scripts.verify_postgres_ops \
            | tee pgs_ops_artifacts/postgres-post-downgrade-refusal.json
      # §7：每个迁移都要验证「有数据时拒绝 lossy downgrade」。0025–0028 的降级
      # 会删掉复核原因、幂等回执与导出审计——这些不是缓存，重建不回来。SQLite
      # 上已有单测，这一步在真实 PostgreSQL 上再证一次，并确认 DDL 未被破坏。
      - name: Prove the v2 audit migrations refuse a lossy downgrade
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import sqlalchemy as sa
          from backend.app.core.config import settings

          engine = sa.create_engine(settings.DATABASE_URL)
          with engine.begin() as conn:
              conn.execute(
                  sa.text(
                      "INSERT INTO export_events "
                      "(id, channel, scope, status, legacy_log_id, created_at) "
                      "VALUES ('ci-lossy', 'xlsx', 'batch', 'generated', "
                      "'ci-legacy', NOW())"
                  )
              )
          PY
          for target in 0027_export_events 0026_review_command_receipts
          do
            if uv run alembic downgrade "$target" >> pgs_ops_artifacts/postgres-migrations.log 2>&1
            then
              echo "ERROR: lossy downgrade to $target unexpectedly succeeded" \
                | tee -a pgs_ops_artifacts/postgres-migrations.log
              exit 1
            fi
            echo "expected refusal for $target" | tee -a pgs_ops_artifacts/postgres-migrations.log
          done
          uv run python -m backend.app.scripts.verify_postgres_ops \
            | tee pgs_ops_artifacts/postgres-v2-downgrade-refusal.json
      - name: Execute isolated database and storage backup restore drill
        run: |
          set -euo pipefail
          mkdir -p pgs_ops_storage/uploads pgs_ops_storage/parsed pgs_ops_backups pgs_ops_restored
          printf 'ci-private-fixture' > pgs_ops_storage/uploads/fixture.docx
          printf '{"snapshot":true}' > pgs_ops_storage/parsed/snapshot.json
          printf 'cache-ledger' > pgs_ops_storage/llm_cache.sqlite
          uv run python -m backend.app.scripts.ops_backup create \
            --storage-root pgs_ops_storage \
            --destination pgs_ops_backups \
            --migration-head 0028_export_event_backfill \
            --revision "$GITHUB_SHA" \
            | tee pgs_ops_artifacts/backup-create.json
          package="$(find pgs_ops_backups -mindepth 1 -maxdepth 1 -type d | head -1)"
          uv run python -m backend.app.scripts.ops_backup verify "$package" \
            | tee pgs_ops_artifacts/backup-verify.json
          createdb --host 127.0.0.1 --username paper recovery_db
          rmdir pgs_ops_restored
          uv run python -m backend.app.scripts.ops_backup restore "$package" \
            --database-url postgresql+psycopg://paper:ci-only-postgres-password@127.0.0.1:5432/recovery_db \
            --storage-target pgs_ops_restored \
            --confirm-database recovery_db \
            | tee pgs_ops_artifacts/restore-report.json
          DATABASE_URL=postgresql+psycopg://paper:ci-only-postgres-password@127.0.0.1:5432/recovery_db \
            uv run python -m backend.app.scripts.verify_postgres_ops \
            | tee pgs_ops_artifacts/restored-postgres-verification.json
          diff pgs_ops_storage/uploads/fixture.docx pgs_ops_restored/uploads/fixture.docx
          cp "$package/manifest.json" pgs_ops_artifacts/backup-manifest.json
      - name: Reject secret leakage in persisted CI evidence
        run: |
          if grep -R -E 'ci-only-postgres-password|PGPASSWORD|AUTH_SECRET|OPENAI(_COMPATIBLE)?_API_KEY' pgs_ops_artifacts
          then
            echo "secret-like material detected in OPS evidence"
            exit 1
          fi
      - name: Upload Postgres and recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgs-postgres-migration-restore-evidence
          path: pgs_ops_artifacts/
          if-no-files-found: error
          retention-days: 30

  docker-compose-smoke:
    needs:
      - unit-and-sqlite-migrations
      - postgres-migrations-constraints-and-restore
    runs-on: ubuntu-latest
    env:
      APP_ENV_FILE: .env.intranet.example
      POSTGRES_DB: paper_grading
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: CI-compose-postgres-password-2026
      AUTH_ENABLED: "true"
      AUTH_USERNAME: ops-admin
      AUTH_PASSWORD: CI-compose-login-password-2026
      AUTH_SECRET: ci-compose-auth-secret-0123456789abcdef
      LLM_DEBUG_LOG_ENABLED: "false"
      PAPER_GRADING_SITE: https://localhost
      SCORING_ENGINE_MODE: legacy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the production application image
        run: |
          mkdir -p pgs_docker_artifacts
          docker compose --env-file .env.intranet.example build --pull app
      - name: Start the complete production stack
        run: |
          docker compose --env-file .env.intranet.example up -d --wait --wait-timeout 180
          docker compose --env-file .env.intranet.example ps \
            | tee pgs_docker_artifacts/compose-ps.txt
      - name: Verify the PostgreSQL 16 client and HTTPS proxy
        run: |
          docker compose --env-file .env.intranet.example exec -T app pg_dump --version \
            | tee pgs_docker_artifacts/pg-dump-version.txt \
            | grep -E ' 16\.'
          curl --fail --silent --show-error --insecure \
            https://localhost/api/system/integrations \
            | tee pgs_docker_artifacts/https-integrations.json
      # 冒烟此前只 curl 了 API，所以「镜像没 COPY public/」这类缺口完全看不见：
      # legacy 入口走 frontend/web 照常工作，只有 /workbench/* 全是 404。
      - name: Verify the workbench ships inside the image
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --insecure \
            https://localhost/workbench/ \
            | tee pgs_docker_artifacts/workbench-index.html \
            | grep -q '/workbench/assets/'
          # 字体与许可证都要在镜像里，离线运行不访问 CDN。
          curl --fail --silent --show-error --insecure \
            https://localhost/workbench/LICENSE-IBM-Plex-Mono.txt \
            | grep -qi 'SIL OPEN FONT LICENSE'
          asset="$(grep -o '/workbench/assets/[A-Za-z0-9_.-]*\.js' \
            pgs_docker_artifacts/workbench-index.html | head -1)"
          # 匹配不到时 curl 会退化成请求根路径并通过——一个检不出自己失效的
          # 检查比没有检查更糟。
          if [[ -z "$asset" ]]
          then
            echo "::error::workbench index.html 里没有 hash 资源引用" 
            exit 1
          fi
          curl --fail --silent --show-error --insecure \
            "https://localhost${asset}" > /dev/null
          # 缺失资源必须 404，不能回落成 HTML。
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --insecure https://localhost/workbench/assets/does-not-exist.js)"
          test "$code" = "404"
      - name: Exercise login upload score report and export
        run: |
          docker compose --env-file .env.intranet.example exec -T app \
            python -m backend.app.scripts.seed_dev
          docker compose --env-file .env.intranet.example exec -T app \
            python -m backend.app.scripts.smoke_deployment \
            | tee pgs_docker_artifacts/deployment-smoke.json
      - name: Exercise backup creation and independent verification in the image
        run: |
          docker compose --env-file .env.intranet.example exec -T app \
            python -m backend.app.scripts.ops_backup create \
            --storage-root /app/storage \
            --destination /app/ops_backups \
            --migration-head 0028_export_event_backfill \
            --revision "$GITHUB_SHA" \
            | tee pgs_docker_artifacts/container-backup-create.json
          docker compose --env-file .env.intranet.example exec -T app sh -ec '
            package="$(find /app/ops_backups -mindepth 1 -maxdepth 1 -type d | head -1)"
            test -n "$package"
            python -m backend.app.scripts.ops_backup verify "$package"
          ' | tee pgs_docker_artifacts/container-backup-verify.json
      - name: Capture container logs
        if: always()
        run: |
          docker compose --env-file .env.intranet.example logs --no-color \
            > pgs_docker_artifacts/compose.log 2>&1 || true
      - name: Stop the disposable stack
        if: always()
        run: docker compose --env-file .env.intranet.example down --volumes --remove-orphans
      - name: Upload Docker deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgs-docker-compose-smoke-evidence
          path: pgs_docker_artifacts/
          if-no-files-found: error
          retention-days: 30

  deploy-vercel-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - docker-compose-smoke
      # The deployed workbench comes from the committed public/ artifact, so a
      # drift or test failure there must block the release like any other gate.
      - frontend-workbench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - name: Validate Vercel deployment secrets
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN
          do
            if [[ -z "${!name:-}" ]]
            then
              echo "::error::Required GitHub production environment secret ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python for the Vercel Python builder
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node.js for the Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Vercel CLI
        # 58.4.4+ reapplies .vercelignore to Python filePathMap entries during
        # --prebuilt deploys and can fail remotely with ENOENT. Keep the last
        # unaffected release until vercel/vercel#17386 is fixed upstream.
        run: npm install --global vercel@58.4.0
      - name: Pull the Vercel production configuration
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build the production deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the prebuilt output to production
        id: deploy
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "[$deployment_url]($deployment_url)" >> "$GITHUB_STEP_SUMMARY"
