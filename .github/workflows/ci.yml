name: pgs-production-gates

# 发布门禁与部署（RUNBOOK 3.0、9.2）。只看 main：
# - develop → main 的发布 PR（以及 hotfix/* 热修 PR）跑全套门禁：代码测试（复用 tests.yml）、
#   PostgreSQL 16 逐版本迁移与恢复演练、Docker Compose 冒烟、生产配置校验；
# - 合并后 push main 再跑一遍门禁，全部通过才部署 Lightsail（Vercel 已停，见下）。
# 功能分支进 develop 只跑 tests.yml，不经过这里。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 发布 PR 推了新提交就取消旧的那次；push 按 run_id 各自独立，部署任务另有自己的串行组。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  SCORING_ENGINE_MODE: legacy
  PYTHONUNBUFFERED: "1"

jobs:
  release-source:
    # main 只接受 develop 的发布 PR 与 hotfix/* 热修（RUNBOOK 3.0）。功能分支直接开到 main，
    # 这里失败并提示改 base；来自 fork 的 PR 也拒绝。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only develop and hotfix branches may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]
          then
            case "$HEAD_REF" in
              develop|hotfix/*) echo "release source: $HEAD_REF"; exit 0 ;;
            esac
          fi
          echo "::error::main 只接受 develop 的发布 PR 与 hotfix/* 热修，当前是 ${HEAD_REPO}:${HEAD_REF}。功能分支请把 PR 的 base 改成 develop（RUNBOOK 3.0）。"
          exit 1

  tests:
    uses: ./.github/workflows/tests.yml

  postgres-migrations-constraints-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paper_grading
          POSTGRES_USER: paper
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paper -d paper_grading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://paper:ci-only-postgres-password@127.0.0.1:5432/paper_grading
      PGPASSWORD: ci-only-postgres-password
      OPS_RTO_MINUTES: "120"
      OPS_RPO_MINUTES: "1440"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install PostgreSQL client and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          uv sync --locked
      - name: Exercise every production migration boundary
        run: |
          set -euo pipefail
          mkdir -p pgs_ops_artifacts
          for revision in \
            0011_version_hash_on_update \
            0012_frozen_scoring_policy \
            0013_core_replay_identity \
            0014_release_gate_profiles \
            0015_scoring_run_runtime_identity \
            0016_general_submissions \
            0017_batch_scoring_jobs \
            0018_identity_organizations \
            0019_resource_organization_scope \
            0020_rubric_visibility_scope \
            0021_private_ai_connections \
            0022_legacy_tenant_backfill \
            0023_rule_scoring_review_tasks \
            0024_batch_status_machine \
            0025_review_contract \
            0026_review_command_receipts \
            0027_export_events \
            0028_export_event_backfill \
            0029_runtime_access_for_v2_tables \
            0030_platform_llm_config \
            0031_rubric_import_sessions \
            0032_single_active_ai_connection \
            0033_rule_decision_ledger \
            0034_anthropic_messages_provider \
            0035_unified_work_queue \
            0036_ai_tasks \
            0037_ai_task_upload_scope \
            0038_assistant_conversations \
            0039_site_leads \
            0040_provider_output_observations \
            0041_assistant_agent_state \
            0042_assistant_message_client_id
          do
            uv run alembic upgrade "$revision" 2>&1 | tee -a pgs_ops_artifacts/postgres-migrations.log
          done
      - name: Verify Postgres constraints and stable ordering
        run: |
          # verify_postgres_ops 的 pgs_app 运行角色清单包含 rubric_import_sessions。
          uv run python -m backend.app.scripts.verify_postgres_ops --exercise-ci-fixture \
            | tee pgs_ops_artifacts/postgres-verification.json
      # 切换到本机数据库时的复制（docs/迁出Supabase到单机Docker方案.md 6.2）：在同一个服务里另建
      # 两个临时库走一遍，验证只读事务与 JSON 等列类型；用完删掉，不碰上面的 paper_grading。
      - name: Rehearse the cutover copy on PostgreSQL
        env:
          PGS_TEST_POSTGRES_URL: postgresql+psycopg://paper:ci-only-postgres-password@127.0.0.1:5432/paper_grading
        run: uv run pytest -q backend/app/tests/test_local_data_plane.py -k postgres
      - name: Prove lossy 0017 downgrade is rejected without DDL damage
        run: |
          set -euo pipefail
          if uv run alembic downgrade 0016_general_submissions >> pgs_ops_artifacts/postgres-migrations.log 2>&1
          then
            echo "ERROR: lossy downgrade unexpectedly succeeded" | tee -a pgs_ops_artifacts/postgres-migrations.log
            exit 1
          fi
          echo "expected lossy downgrade refusal observed" | tee -a pgs_ops_artifacts/postgres-migrations.log
          uv run python -m backend.app.scripts.verify_postgres_ops \
            | tee pgs_ops_artifacts/postgres-post-downgrade-refusal.json
      # §7：每个迁移都要验证「有数据时拒绝 lossy downgrade」。0025–0028 的降级
      # 会删掉复核原因、幂等回执与导出审计——这些不是缓存，重建不回来。SQLite
      # 上已有单测，这一步在真实 PostgreSQL 上再证一次，并确认 DDL 未被破坏。
      - name: Prove the v2 audit migrations refuse a lossy downgrade
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import sqlalchemy as sa
          from backend.app.core.config import settings

          engine = sa.create_engine(settings.DATABASE_URL)
          with engine.begin() as conn:
              conn.execute(
                  sa.text(
                      "INSERT INTO export_events "
                      "(id, channel, scope, status, legacy_log_id, created_at) "
                      "VALUES ('ci-lossy', 'xlsx', 'batch', 'generated', "
                      "'ci-legacy', NOW())"
                  )
              )
          PY
          for target in 0027_export_events 0026_review_command_receipts
          do
            if uv run alembic downgrade "$target" >> pgs_ops_artifacts/postgres-migrations.log 2>&1
            then
              echo "ERROR: lossy downgrade to $target unexpectedly succeeded" \
                | tee -a pgs_ops_artifacts/postgres-migrations.log
              exit 1
            fi
            echo "expected refusal for $target" | tee -a pgs_ops_artifacts/postgres-migrations.log
          done
          uv run python -m backend.app.scripts.verify_postgres_ops \
            | tee pgs_ops_artifacts/postgres-v2-downgrade-refusal.json
      - name: Execute isolated database and storage backup restore drill
        run: |
          set -euo pipefail
          mkdir -p pgs_ops_storage/uploads pgs_ops_storage/parsed pgs_ops_backups pgs_ops_restored
          printf 'ci-private-fixture' > pgs_ops_storage/uploads/fixture.docx
          printf '{"snapshot":true}' > pgs_ops_storage/parsed/snapshot.json
          printf 'cache-ledger' > pgs_ops_storage/llm_cache.sqlite
          uv run python -m backend.app.scripts.ops_backup create \
            --storage-root pgs_ops_storage \
            --destination pgs_ops_backups \
            --migration-head 0028_export_event_backfill \
            --revision "$GITHUB_SHA" \
            | tee pgs_ops_artifacts/backup-create.json
          package="$(find pgs_ops_backups -mindepth 1 -maxdepth 1 -type d | head -1)"
          uv run python -m backend.app.scripts.ops_backup verify "$package" \
            | tee pgs_ops_artifacts/backup-verify.json
          createdb --host 127.0.0.1 --username paper recovery_db
          rmdir pgs_ops_restored
          uv run python -m backend.app.scripts.ops_backup restore "$package" \
            --database-url postgresql+psycopg://paper:ci-only-postgres-password@127.0.0.1:5432/recovery_db \
            --storage-target pgs_ops_restored \
            --confirm-database recovery_db \
            | tee pgs_ops_artifacts/restore-report.json
          DATABASE_URL=postgresql+psycopg://paper:ci-only-postgres-password@127.0.0.1:5432/recovery_db \
            uv run python -m backend.app.scripts.verify_postgres_ops \
            | tee pgs_ops_artifacts/restored-postgres-verification.json
          diff pgs_ops_storage/uploads/fixture.docx pgs_ops_restored/uploads/fixture.docx
          cp "$package/manifest.json" pgs_ops_artifacts/backup-manifest.json
      # 全新环境（Lightsail 生产）的初始化脚本：空库上建运行角色、跑迁移、补齐 0023 之前那批表
      # 的授权与行级安全，再以运行角色读写一遍。平时本地与 CI 都不建 pgs_app，这是唯一用真实
      # PostgreSQL 验证这条路径的地方。放在最后：之后的步骤不会因为角色存在而改变行为。
      - name: Initialize an empty database and use it as the runtime role
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://paper:ci-only-postgres-password@127.0.0.1:5432/pgs_init_check
          PGS_APP_PASSWORD: CiRuntimeRolePassword2026abcdef
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U paper pgs_init_check
          uv run python -m backend.app.scripts.init_database | tee pgs_ops_artifacts/init-database.log
          # 重跑必须无副作用：角色与策略已存在时跳过，不报 already exists。
          uv run python -m backend.app.scripts.init_database | tee -a pgs_ops_artifacts/init-database.log
          DATABASE_URL="postgresql+psycopg://pgs_app:${PGS_APP_PASSWORD}@127.0.0.1:5432/pgs_init_check" \
            uv run python -m backend.app.scripts.verify_postgres_ops --exercise-ci-fixture \
            | tee pgs_ops_artifacts/init-runtime-verification.json
          # 逐表、逐项撤掉 DML 权限，验证门禁拒绝；每次都回滚，不留下权限变化。
          PGS_TEST_POSTGRES_VERIFIER_URL="$MIGRATION_DATABASE_URL" \
            uv run pytest -q backend/app/tests/test_postgres_runtime_access.py \
            | tee pgs_ops_artifacts/init-runtime-privilege-regressions.log
      - name: Reject secret leakage in persisted CI evidence
        run: |
          if grep -R -E 'ci-only-postgres-password|CiRuntimeRolePassword|PGPASSWORD|AUTH_SECRET|OPENAI(_COMPATIBLE)?_API_KEY' pgs_ops_artifacts
          then
            echo "secret-like material detected in OPS evidence"
            exit 1
          fi
      - name: Upload Postgres and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-postgres-migration-restore-evidence
          path: pgs_ops_artifacts/
          if-no-files-found: error
          retention-days: 30

  docker-compose-smoke:
    needs:
      - tests
      - postgres-migrations-constraints-and-restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 显式写 shell: bash 时 Actions 用 `bash -eo pipefail`；默认的 `bash -e` 没有
    # pipefail，`python … | tee` 会取 tee 的退出码。冒烟脚本曾因此在登录改成
    # Cookie 后崩溃了一个多月，这一步仍是绿的。
    defaults:
      run:
        shell: bash
    env:
      APP_ENV_FILE: .env.intranet.example
      POSTGRES_DB: paper_grading
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: CI-compose-postgres-password-2026
      AUTH_ENABLED: "true"
      AUTH_USERNAME: ops-admin
      AUTH_PASSWORD: CI-compose-login-password-2026
      AUTH_SECRET: ci-compose-auth-secret-0123456789abcdef
      LLM_DEBUG_LOG_ENABLED: "false"
      PAPER_GRADING_SITE: https://localhost
      SCORING_ENGINE_MODE: legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production application image
        run: |
          mkdir -p pgs_docker_artifacts
          docker compose --env-file .env.intranet.example build --pull app
      - name: Start the complete production stack
        run: |
          set -euo pipefail
          docker compose --env-file .env.intranet.example up -d --wait --wait-timeout 180
          docker compose --env-file .env.intranet.example ps \
            | tee pgs_docker_artifacts/compose-ps.txt
          # 自部署没有队列服务，后台评分只靠 worker 轮询数据库；它没起来时
          # 「开始评分」会永远停在排队中，而 /api 健康检查照样是绿的。
          # 先取完整输出再匹配：pipefail 下 `| grep -q` 提前退出会让上游收到 SIGPIPE。
          running="$(docker compose --env-file .env.intranet.example ps --status running --services)"
          grep -qx worker <<<"$running"
      - name: Verify the PostgreSQL 16 client and HTTPS proxy
        run: |
          docker compose --env-file .env.intranet.example exec -T app pg_dump --version \
            | tee pgs_docker_artifacts/pg-dump-version.txt \
            | grep -E ' 16\.'
          curl --fail --silent --show-error --insecure \
            https://localhost/api/system/integrations \
            | tee pgs_docker_artifacts/https-integrations.json
      # 冒烟此前只 curl 了 API，所以「镜像没 COPY public/」这类缺口完全看不见：
      # legacy 入口走 frontend/web 照常工作，只有 /workbench/* 全是 404。
      - name: Verify the workbench ships inside the image
        run: |
          set -euo pipefail
          # 根路径是宣传页（2026-10-17），`/legacy/` 必须没有页面。
          # 这条只在容器里才测得到——Vercel 走静态文件，本地走 uvicorn，
          # 三种托管各自可能只对一半。
          #
          # 一律先存文件再匹配：pipefail 下 `curl … | grep -q` 里 grep 一匹配就退出，
          # curl 还没写完就收到断开的管道，以退出码 23 失败——时有时无，2026-10-18
          # 在 PR #40 上踩到（与改动无关）。
          curl --fail --silent --show-error --insecure https://localhost/ \
            --output pgs_docker_artifacts/root-index.html
          grep -q "/workbench/assets/site-" pgs_docker_artifacts/root-index.html
          legacy="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --insecure https://localhost/legacy/)"
          if [[ "$legacy" != "404" ]]
          then
            echo "::error::/legacy/ 应返回 404，实际 $legacy"
            exit 1
          fi
          curl --fail --silent --show-error --insecure \
            https://localhost/workbench/ \
            --output pgs_docker_artifacts/workbench-index.html
          grep -q '/workbench/assets/' pgs_docker_artifacts/workbench-index.html
          # 字体与许可证都要在镜像里，离线运行不访问 CDN。
          curl --fail --silent --show-error --insecure \
            https://localhost/workbench/LICENSE-IBM-Plex-Mono.txt \
            --output pgs_docker_artifacts/font-licence.txt
          grep -qi 'SIL OPEN FONT LICENSE' pgs_docker_artifacts/font-licence.txt
          asset="$(grep -o '/workbench/assets/[A-Za-z0-9_.-]*\.js' \
            pgs_docker_artifacts/workbench-index.html | head -1)"
          # 匹配不到时 curl 会退化成请求根路径并通过——一个检不出自己失效的
          # 检查比没有检查更糟。
          if [[ -z "$asset" ]]
          then
            echo "::error::workbench index.html 里没有 hash 资源引用" 
            exit 1
          fi
          curl --fail --silent --show-error --insecure \
            "https://localhost${asset}" > /dev/null
          # 缺失资源必须 404，不能回落成 HTML。
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --insecure https://localhost/workbench/assets/does-not-exist.js)"
          test "$code" = "404"
      # smoke_deployment 会创建后台评分任务并等它到终态：只有 worker 真正在
      # 领取任务时才会通过，补的是「接口都健康、任务却没人执行」这个盲区。
      - name: Exercise login upload and fail-closed background scoring
        run: |
          docker compose --env-file .env.intranet.example exec -T app \
            python -m backend.app.scripts.seed_dev
          # 冒烟栈没有配置平台模型，也没有绑定连接；受保护部署不回落 Mock（D-028），
          # 所以验证的是：worker 领取任务后明确拒绝评分，同步评分返回 503。
          docker compose --env-file .env.intranet.example exec -T app \
            python -m backend.app.scripts.smoke_deployment --scoring fail-closed \
            | tee pgs_docker_artifacts/deployment-smoke.json
      - name: Exercise backup creation and independent verification in the image
        run: |
          docker compose --env-file .env.intranet.example exec -T app \
            python -m backend.app.scripts.ops_backup create \
            --storage-root /app/storage \
            --destination /app/ops_backups \
            --migration-head 0028_export_event_backfill \
            --revision "$GITHUB_SHA" \
            | tee pgs_docker_artifacts/container-backup-create.json
          docker compose --env-file .env.intranet.example exec -T app sh -ec '
            package="$(find /app/ops_backups -mindepth 1 -maxdepth 1 -type d | head -1)"
            test -n "$package"
            python -m backend.app.scripts.ops_backup verify "$package"
          ' | tee pgs_docker_artifacts/container-backup-verify.json
      - name: Capture container logs
        if: always()
        run: |
          docker compose --env-file .env.intranet.example logs --no-color \
            > pgs_docker_artifacts/compose.log 2>&1 || true
      - name: Stop the disposable stack
        if: always()
        run: docker compose --env-file .env.intranet.example down --volumes --remove-orphans
      - name: Upload Docker deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-docker-compose-smoke-evidence
          path: pgs_docker_artifacts/
          if-no-files-found: error
          retention-days: 30

  deploy-vercel-production:
    # 迁到 Lightsail 后（S3），Vercel 项目只剩跳转规则；先把仓库变量
    # VERCEL_DEPLOY_ENABLED 设为 false，否则下一次合并会把整个应用重新部署回去、
    # 盖掉跳转。见 RUNBOOK「部署平台迁移：Vercel → Lightsail」。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED != 'false'
    needs:
      - docker-compose-smoke
      # The deployed workbench comes from the committed public/ artifact, so a
      # drift or test failure there must block the release like any other gate.
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - name: Validate Vercel deployment secrets
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN
          do
            if [[ -z "${!name:-}" ]]
            then
              echo "::error::Required GitHub production environment secret ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python for the Vercel Python builder
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node.js for the Vercel CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the Vercel CLI
        # 58.4.4+ reapplies .vercelignore to Python filePathMap entries during
        # --prebuilt deploys and can fail remotely with ENOENT. Keep the last
        # unaffected release until vercel/vercel#17386 is fixed upstream.
        run: npm install --global vercel@58.4.0
      - name: Pull the Vercel production configuration
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Pin the reduced-motion landing page for Vercel
        # 用户决定（2026-10-17）：Vercel 上的宣传页固定为少动效版，Lightsail 保持正常
        # 动效（仍照顾访客自己开的「减少动态效果」）。只改本次部署的工作区，
        # 仓库里的 public/ 不带这个设置。必须在 vercel build 之前：它把 public/ 拷进产物。
        run: python3 scripts/build_web_static.py --landing-motion reduced
      - name: Build the production deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the prebuilt output to production
        id: deploy
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "[$deployment_url]($deployment_url)" >> "$GITHUB_STEP_SUMMARY"

  production-config:
    # 生产（Lightsail）的 compose、Caddyfile 与部署脚本在合并前就要能用：
    # 部署时才发现语法错误，线上已经切了一半。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the production compose file
        working-directory: deploy/production
        run: |
          printf 'PGS_SITE_ADDRESS=pgs-ci.duckdns.org\n' > .env
          printf 'POSTGRES_PASSWORD=ci\n' > db.env
          docker compose --project-name pgs --file compose.yml config --quiet
      - name: Validate the production Caddyfile
        run: |
          docker run --rm -e PGS_SITE_ADDRESS=pgs-ci.duckdns.org \
            -v "$PWD/deploy/production/caddy:/etc/caddy:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Lint the deployment scripts
        run: shellcheck deploy/production/bootstrap.sh deploy/production/deploy.sh deploy/production/ops.sh

  # main 的分支保护只认这一项：门禁里加减任务时不必改保护规则。release-source 只在 PR 上运行，
  # push 与手动运行时它被跳过是正常的；其余每一项都必须成功。
  release-gates-passed:
    if: ${{ !cancelled() }}
    needs:
      - release-source
      - tests
      - postgres-migrations-constraints-and-restore
      - docker-compose-smoke
      - production-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release gate to succeed
        env:
          SOURCE: ${{ needs.release-source.result }}
          EVENT: ${{ github.event_name }}
          RESULTS: >-
            ${{ needs.tests.result }}
            ${{ needs.postgres-migrations-constraints-and-restore.result }}
            ${{ needs.docker-compose-smoke.result }}
            ${{ needs.production-config.result }}
        run: |
          echo "release-source: $SOURCE; gates: $RESULTS"
          if [ "$EVENT" = "pull_request" ] && [ "$SOURCE" != "success" ]
          then
            echo "::error::release-source ended with '$SOURCE'"
            exit 1
          fi
          for result in $RESULTS
          do
            if [ "$result" != "success" ]
            then
              echo "::error::a release gate ended with '$result'"
              exit 1
            fi
          done

  deploy-lightsail-production:
    # 生产部署到 AWS Lightsail 单机（docs/部署平台迁移到AWS方案.md）。仓库变量
    # LIGHTSAIL_DEPLOY_ENABLED=true 之前不执行：实例、.env 与部署密钥要先准备好。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LIGHTSAIL_DEPLOY_ENABLED == 'true'
    needs:
      - docker-compose-smoke
      - tests
      - production-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: lightsail-production
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      IMAGE: paper-grading-system:${{ github.sha }}
      SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
    steps:
      - name: Validate deployment settings
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          BYOK_MASTER_KEY: ${{ secrets.BYOK_MASTER_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          AUTH_USERNAME: ${{ vars.AUTH_USERNAME }}
          # db 容器两种数据位置下都在运行：切换前也要用它初始化（空库）。
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGS_APP_PASSWORD: ${{ secrets.PGS_APP_PASSWORD }}
        # RUNTIME_DATABASE_URL 与 SUPABASE_* 只在数据还在 Supabase 时需要：由 production_env.py
        # 按实例上的 DATA_PLANE 检查（docs/迁出Supabase到单机Docker方案.md 8.1）。
        run: |
          set -euo pipefail
          missing=0
          for name in PRODUCTION_SSH_KEY PRODUCTION_SSH_HOST PRODUCTION_SSH_KNOWN_HOSTS SITE_URL \
            BYOK_MASTER_KEY AUTH_SECRET AUTH_PASSWORD AUTH_USERNAME POSTGRES_PASSWORD PGS_APP_PASSWORD
          do
            if [[ -z "${!name:-}" ]]
            then
              echo "::error::Required production setting ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/pgs_deploy
          chmod 0600 ~/.ssh/pgs_deploy
          # 主机指纹由维护者核对后写进密钥；不用 ssh-keyscan 现取，防止中间人。
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host pgs
            HostName ${PRODUCTION_SSH_HOST}
            User deploy
            IdentityFile ~/.ssh/pgs_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CONFIG
      # 实例上的 /opt/pgs/DATA_PLANE 决定 .env 连哪个库（没有即 supabase）：由切换工作流
      # production-cutover.yml 写入，不用仓库变量——切换完成到改变量之间的任何一次部署都会连回 Supabase。
      - name: Read where the data lives
        id: plane
        run: |
          set -euo pipefail
          plane="$(ssh pgs 'cat /opt/pgs/DATA_PLANE 2>/dev/null || true')"
          plane="${plane:-supabase}"
          if [[ "$plane" != "supabase" && "$plane" != "local" ]]
          then
            echo "::error::/opt/pgs/DATA_PLANE 只能是 supabase 或 local"
            exit 1
          fi
          echo "plane=$plane" >> "$GITHUB_OUTPUT"
          echo "数据位置：$plane"
          ssh pgs 'df -h / | tail -1'
      - name: Build the application image
        run: docker build --pull --tag "$IMAGE" .
      # 打开评分助手 Agent 的门槛（docs/评分助手Agent化方案.md §12.5）：按这个镜像里的提示词指纹，
      # 在仓库的评测报告里找一轮门槛全过、没有作废的；没有就不部署。开关关着时不检查。不调用模型。
      - name: Check the assistant eval gate
        if: vars.ASSISTANT_AGENT_ENABLED == 'true'
        run: |
          docker run --rm --network none --volume "$PWD/docs/评测报告/评分助手:/reports:ro" "$IMAGE" \
            python -m backend.app.scripts.assistant_eval_gate /reports
      - name: Ship the image and deployment files
        run: |
          set -euo pipefail
          docker save "$IMAGE" | gzip -1 | ssh pgs 'gunzip | docker load'
          tar -C deploy/production -czf - compose.yml deploy.sh ops.sh caddy \
            | ssh pgs 'tar -xzf - -C /opt/pgs && chmod 0755 /opt/pgs/deploy.sh /opt/pgs/ops.sh'
      # 实例上的 .env 每次部署都由这里重新生成：生产密钥只存在 GitHub production 环境里，
      # 改密钥就是改 GitHub 上的值再部署一次。经 SSH 的标准输入写入，不落在命令行里。
      - name: Write the runtime environment
        env:
          DATA_PLANE: ${{ steps.plane.outputs.plane }}
          DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGS_APP_PASSWORD: ${{ secrets.PGS_APP_PASSWORD }}
          BYOK_MASTER_KEY: ${{ secrets.BYOK_MASTER_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          AUTH_USERNAME: ${{ vars.AUTH_USERNAME }}
          # 官网申请表单的开关（docs/官网申请落库改造方案.md）；没设即关闭。
          SITE_LEADS_ENABLED: ${{ vars.SITE_LEADS_ENABLED }}
          # 评分助手的 Agent 回合（docs/评分助手Agent化方案.md）；没设即关闭，A1 评测达标后才设为 true。
          ASSISTANT_AGENT_ENABLED: ${{ vars.ASSISTANT_AGENT_ENABLED }}
          # 评分助手的过程流式（docs/评分助手过程流式方案.md）；没设即关闭，在实例上核实推送不被攒住后再设。
          ASSISTANT_STREAM_ENABLED: ${{ vars.ASSISTANT_STREAM_ENABLED }}
          # 论文评分第二阶段（docs/论文评分第二阶段改造方案.md）；没设即取默认值，QWK 评测后再设。
          SCORING_TOKEN_BUDGET_TARGET: ${{ vars.SCORING_TOKEN_BUDGET_TARGET }}
          SCORING_JUDGE_SCOPE_ENABLED: ${{ vars.SCORING_JUDGE_SCOPE_ENABLED }}
          SCORING_INSUFFICIENT_EVIDENCE_MODE: ${{ vars.SCORING_INSUFFICIENT_EVIDENCE_MODE }}
          # 评分证据与理由（docs/评分证据与理由改造方案.md）；没设即 off，统一评测后再设。
          SCORING_DECISION_BASIS_MODE: ${{ vars.SCORING_DECISION_BASIS_MODE }}
        run: |
          set -euo pipefail
          host="${SITE_URL#https://}"
          host="${host%%/*}"
          env_file="$RUNNER_TEMP/pgs.env"
          db_file="$RUNNER_TEMP/db.env"
          trap 'rm -f "$env_file" "$db_file"' EXIT
          python3 scripts/production_env.py --from-environment --data-plane "$DATA_PLANE" \
            --site-address "$host" --output "$env_file"
          python3 scripts/production_env.py --from-environment --data-plane "$DATA_PLANE" \
            --kind db --output "$db_file"
          ssh pgs 'umask 077 && cat > /opt/pgs/.env.new && mv /opt/pgs/.env.new /opt/pgs/.env' < "$env_file"
          ssh pgs 'umask 077 && cat > /opt/pgs/db.env.new && mv /opt/pgs/db.env.new /opt/pgs/db.env' < "$db_file"
      - name: Switch to this version
        run: ssh pgs "/opt/pgs/deploy.sh ${GITHUB_SHA}"
      - name: Smoke test through the public address
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            --dump-header headers.txt --output health.json "${SITE_URL%/}/api/system/health"
          cat health.json
          grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains' headers.txt
          grep -qi '^x-frame-options: SAMEORIGIN' headers.txt
          echo "### Lightsail production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "${GITHUB_SHA} → ${SITE_URL}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the deploy key from the runner
        if: always()
        run: rm -f ~/.ssh/pgs_deploy
