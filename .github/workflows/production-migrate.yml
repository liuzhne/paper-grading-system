name: pgs-production-migrate

# 生产数据库迁移。**手动触发 + production Environment 审批**，不随 push 自动执行。
#
# 存在的理由：生产运行角色 `pgs_app` 按设计没有 DDL，迁移必须用 owner 连接串。
# 把那串东西放进 GitHub Secrets 并由本工作流使用，好过在某台笔记本上手工执行——
# 凭据不进任何人的命令行与 shell 历史，每次执行有审批与日志，换人也照样能跑。
#
# 在实例上执行（docs/迁出Supabase到单机Docker方案.md 5.2）：数据库改成同机的 db 容器后不对外
# 开端口，GitHub runner 连不到它。这里构建本提交的镜像、送到实例，用一次性容器
# （deploy/production/ops.sh）跑 backend/app/scripts/production_migrate.py，跑完删掉这个镜像。
# 连接串按实例上的 /opt/pgs/DATA_PLANE 选（scripts/production_env.py --kind ops）：local 用
# POSTGRES_PASSWORD / PGS_APP_PASSWORD 拼出 …@db:5432/pgs；supabase（切换前）用 MIGRATION_DATABASE_URL
# 与 RUNTIME_DATABASE_URL。连接串经 SSH 标准输入传过去，不出现在命令行里。
#
# 不导出数据库快照作为 artifact：生产库含学生 PII，仓库的既有约定是真实论文、
# Secret 与 PII 不得进入 CI artifact。回滚依赖 PostgreSQL 的事务化 DDL（任一迁移
# 失败整体回滚）与备份：本机数据库不做自动备份（RUNBOOK 9.4.1），迁移前需要时手工导出一份。

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: "预期迁移到的 head（照抄仓库当前 head，防止误点）"
        required: true
        type: string
      dry_run:
        description: "只打印当前版本与待执行迁移，不写入"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: bash
    env:
      IMAGE_TAG: migrate-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # 输入的 head 必须与仓库当前 head 一致。误点一次工作流不该把数据库带到
      # 一个谁也没打算去的版本。
      - name: Refuse to run unless the requested head matches this commit
        run: |
          set -euo pipefail
          actual="$(uv run python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          config = Config()
          config.set_main_option("script_location", "alembic")
          print(ScriptDirectory.from_config(config).get_current_head())
          PY
          )"
          if [[ "$actual" != "${{ inputs.expected_head }}" ]]
          then
            echo "::error::输入的 head 与本 commit 不一致：仓库为 $actual，输入为 ${{ inputs.expected_head }}"
            exit 1
          fi
          echo "head 校验通过：$actual"

      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in PRODUCTION_SSH_KEY PRODUCTION_SSH_HOST PRODUCTION_SSH_KNOWN_HOSTS
          do
            if [[ -z "${!name:-}" ]]
            then
              echo "::error::缺少 secret ${name}"
              exit 1
            fi
          done
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/pgs_deploy
          chmod 0600 ~/.ssh/pgs_deploy
          # 主机指纹由维护者核对后写进密钥；不用 ssh-keyscan 现取，防止中间人。
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host pgs
            HostName ${PRODUCTION_SSH_HOST}
            User deploy
            IdentityFile ~/.ssh/pgs_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CONFIG

      - name: Read where the data lives
        id: plane
        run: |
          set -euo pipefail
          plane="$(ssh pgs 'cat /opt/pgs/DATA_PLANE 2>/dev/null || true')"
          plane="${plane:-supabase}"
          if [[ "$plane" != "supabase" && "$plane" != "local" ]]
          then
            echo "::error::/opt/pgs/DATA_PLANE 只能是 supabase 或 local"
            exit 1
          fi
          echo "plane=$plane" >> "$GITHUB_OUTPUT"
          echo "数据位置：$plane"

      # owner 与运行角色的连接串（缺了就停在这里，不碰数据库）。写在 runner 的临时目录，
      # 最后一步删除；每一步经 SSH 标准输入交给 ops.sh。
      - name: Validate the migration credential is configured
        env:
          DATA_PLANE: ${{ steps.plane.outputs.plane }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGS_APP_PASSWORD: ${{ secrets.PGS_APP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/production_env.py --from-environment --kind ops --data-plane "$DATA_PLANE" \
            --output "$RUNNER_TEMP/ops.env"

      # 只在数据还在 Supabase 时有意义。Supabase 的 Direct connection（`db.<ref>.supabase.co`）
      # **只解析出 IPv6**；连不上时那段 traceback 看起来像数据库挂了，实际只是选错了连接串。
      # 这一步把它翻译成能照做的说明。
      - name: Refuse an IPv6-only host early
        if: steps.plane.outputs.plane == 'supabase'
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import os
          import socket
          import sys

          from sqlalchemy.engine import make_url

          host = make_url(os.environ["DATABASE_URL"]).host
          families = {info[0] for info in socket.getaddrinfo(host, None)}
          if socket.AF_INET in families:
              print("host %s 有 IPv4 记录" % host)
              sys.exit(0)
          print(
              "::error::host %s 只解析出 IPv6。\n"
              "Supabase 的 Direct connection 是 IPv6-only；请把 secret "
              "MIGRATION_DATABASE_URL 换成 **Session pooler** 连接串"
              "（Supabase → Connect → Session pooler，主机形如 "
              "aws-*.pooler.supabase.com，端口 5432）。\n"
              "不要用 Transaction pooler（6543）：它不支持迁移需要的会话级特性。"
              % host
          )
          sys.exit(1)
          PY

      # 迁移要用本提交的代码，而实例上只有已部署的版本：临时送一个镜像过去，最后一步删除。
      - name: Build and ship the migration image
        run: |
          set -euo pipefail
          docker build --pull --tag "paper-grading-system:$IMAGE_TAG" .
          docker save "paper-grading-system:$IMAGE_TAG" | gzip -1 | ssh pgs 'gunzip | docker load'
          tar -C deploy/production -czf - ops.sh | ssh pgs 'tar -xzf - -C /opt/pgs && chmod 0755 /opt/pgs/ops.sh'

      # 只读普查：当前版本与各表行数。不打印任何行内容，因此日志里不会出现 PII。
      - name: Survey the database before migrating
        run: ssh pgs "/opt/pgs/ops.sh $IMAGE_TAG python -m backend.app.scripts.production_migrate survey" < "$RUNNER_TEMP/ops.env"

      - name: Show pending migrations
        run: ssh pgs "/opt/pgs/ops.sh $IMAGE_TAG python -m backend.app.scripts.production_migrate pending" < "$RUNNER_TEMP/ops.env"

      # 同时比较布尔与字符串：UI 触发给的是真布尔，`gh workflow run -f` 走 API
      # 时可能是字符串。只写 `== false` 的话，命令行触发会让这一步被静默跳过，
      # 而整个 run 显示成功——「什么都没做但看起来做了」比失败更难发现。
      - name: Upgrade to head
        if: ${{ inputs.dry_run == false || inputs.dry_run == 'false' }}
        run: ssh pgs "/opt/pgs/ops.sh $IMAGE_TAG python -m backend.app.scripts.production_migrate upgrade" < "$RUNNER_TEMP/ops.env"

      # 用**运行角色**验证，而不是 owner：owner 什么都读得到，证明不了应用能不能
      # 工作。0026/0027 的新表就是靠这一步才会暴露缺授权（见 0029）。production_migrate verify
      # 只用 RUNTIME_DATABASE_URL，逐张读 postgres_verifier.RUNTIME_ACCESS_TABLES。
      - name: Verify with the runtime role
        if: ${{ inputs.dry_run == false || inputs.dry_run == 'false' }}
        run: ssh pgs "/opt/pgs/ops.sh $IMAGE_TAG python -m backend.app.scripts.production_migrate verify" < "$RUNNER_TEMP/ops.env"

      - name: Remove the migration image and credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ops.env"
          if [[ -f ~/.ssh/config ]]
          then
            ssh pgs "docker image rm paper-grading-system:$IMAGE_TAG >/dev/null 2>&1 || true"
          fi
          rm -f ~/.ssh/pgs_deploy
