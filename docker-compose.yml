services:
  db:
    image: postgres:16-alpine
    container_name: paper-grading-db
    environment:
      POSTGRES_DB: paper_grading
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: paper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper_grading"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

