[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-grading-system"
version = "0.1.0"
description = "MVP for AI-assisted graduate thesis grading."
requires-python = ">=3.10,<3.13"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "openai>=2.38.0",
  "openpyxl>=3.1.2",
  "psycopg[binary]>=3.1.18",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.1",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.9",
  "requests>=2.31.0",
  "rich>=15.0.0",
  "sqlalchemy>=2.0.27",
  "supabase>=2.0.0,<3.0.0",
  "typer>=0.23.2",
  "uvicorn[standard]>=0.27.1",
]

[project.optional-dependencies]
streamlit = ["streamlit>=1.33.0"]

[project.scripts]
pgs = "backend.app.cli.main:run"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/app/tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
exclude = ["backend/app/tests"]
